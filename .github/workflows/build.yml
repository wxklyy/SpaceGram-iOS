name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Apply SpaceGram Branding
        run: |
          set -x
          echo "Applying SpaceGram rename..."
          find . -name "*.strings" -o -name "*.plist" | while read -r file; do
            sed -i '' 's/"CFBundleDisplayName" = "Telegram"/"CFBundleDisplayName" = "SpaceGram"/g' "$file" 2>/dev/null || true
            sed -i '' 's/<string>Telegram<\/string>/<string>SpaceGram<\/string>/g' "$file" 2>/dev/null || true
            sed -i '' 's/"ApplicationName" = "Telegram"/"ApplicationName" = "SpaceGram"/g' "$file" 2>/dev/null || true
            sed -i '' 's/"AppName" = "Telegram"/"AppName" = "SpaceGram"/g' "$file" 2>/dev/null || true
          done

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build SpaceGram IPA
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/SpaceGram.ipa"
          done

      - name: Upload SpaceGram IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGram-iOS-v${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/SpaceGram.ipa
          if-no-files-found: error
