name: Fast SpaceGram IPA Generator

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  patch-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Download Official Telegram IPA
        run: |
          echo "[*] Downloading official Telegram iOS package..."
          curl -sL -o Telegram.ipa "https://github.com/TelegramMessenger/Telegram-iOS/releases/download/build-26855/Telegram.ipa"
          ls -lh Telegram.ipa

      - name: Unpack and Apply SpaceGram Branding
        run: |
          echo "[*] Extracting IPA..."
          unzip -q Telegram.ipa
          
          APP_PATH="Payload/Telegram.app"
          
          echo "[*] Modifying Info.plist branding..."
          python3 - << 'EOF'
          import plistlib
          import os

          plist_path = "Payload/Telegram.app/Info.plist"
          with open(plist_path, "rb") as f:
              pl = plistlib.load(f)

          pl["CFBundleDisplayName"] = "SpaceGram"
          pl["CFBundleName"] = "SpaceGram"

          with open(plist_path, "wb") as f:
              plistlib.dump(pl, f)

          print("[+] Successfully changed CFBundleDisplayName and CFBundleName to SpaceGram")
          EOF

          # Patch localizations (.lproj)
          find Payload/Telegram.app -name "InfoPlist.strings" | while read -r f; do
            sed -i 's/"CFBundleDisplayName" = ".*"/"CFBundleDisplayName" = "SpaceGram"/g' "$f" 2>/dev/null || true
          done

      - name: Package SpaceGram.ipa
        run: |
          echo "[*] Zipping modified Payload into SpaceGram.ipa..."
          zip -qr SpaceGram.ipa Payload
          ls -lh SpaceGram.ipa

      - name: Upload SpaceGram IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGram-iOS-Ready
          path: SpaceGram.ipa
          if-no-files-found: error
